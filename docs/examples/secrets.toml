# The secrets file of a site: every hls command that plans an instance reads
# which secret each stage is granted, and the runner of each allocation reads the values its
# stages are granted. It is a cluster-local file at the path hls.toml names as
# site.secrets_path, outside every checkout and the store, owned by you, mode 0600. A checkout
# holding any file named .secrets.toml* is refused, because harness roles bind the checkout.
#
# [secrets] holds the values: each name is lowercase snake case, each value at least 8
# printable ASCII characters without a double quote, a backslash, a $ or a backtick, so the scrubber
# can find it in any record and an env file holds it unchanged. [grants] says which stage
# gets which secret as which variable. A secret nobody is granted reaches nothing. Grantees
# are "stage.<stage name>", for host-side stages such as provision and images.
#
# Every value here is a secret wherever it appears: a role whose arguments or variables hold
# one is refused. So a value that is an ordinary word of a path, such as the cluster login
# name, does not belong here. The images stage's Docker Hub login is split for that reason:
# only its token is a secret, granted as REGISTRY_PASSWORD; the user name goes in hls.toml as
#
#     [site]
#     registry_username = "<user>"
#
# A file that grants REGISTRY_USERNAME or DOCKER_USERNAME is refused, and so is a plan whose
# site.registry_username holds a value of this file. Set both or neither.
#
# An agent is never granted here. Its arm names a route in hls.toml, and the route names the
# secrets that hold its credential and its base URL; the agent gets those and nothing else.
# A base URL is a secret like the credential, so plans and records name the route and its
# secrets, never the URL or its host. Planning refuses a granted base URL that is not an
# https URL with a host. The two routes of docs/examples/hls.toml name anthropic_key and
# openai_key below and reach the providers' own APIs. A route through a relay names the secret
# of its base URL too; for relay_token and relay_url below, hls.toml would hold:
#
#   [routes.relay]
#   credential = "relay_token"
#   base_url = "relay_url"
#   auth = "bearer"
#
#   [arms.example]
#   harness = "claude-code"
#   model = "example-model"
#   context_window = 1000000
#   output_limit = 64000
#   route = "relay"

[secrets]
hf_token = "hf_xxxxxxxxxxxxxxxxxxxx"
anthropic_key = "sk-ant-xxxxxxxxxxxxxxxx"
openai_key = "sk-proj-xxxxxxxxxxxxxxxx"
relay_token = "relay-xxxxxxxxxxxxxxxx"
relay_url = "https://relay.example/v1"
# The Docker Hub token the images and sandbox_images stages log in with, beside
# site.registry_username; leave all of them out to pull anonymously.
# registry_token = "dckr_pat_xxxxxxxxxxxxxxxx"

[grants]
"stage.provision".HF_TOKEN = "hf_token"
# "stage.images".REGISTRY_PASSWORD = "registry_token"
# "stage.sandbox_images".REGISTRY_PASSWORD = "registry_token"
